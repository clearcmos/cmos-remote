# Optional, fast checks only: format and lint. CI remains the authority, so
# nothing slow (tests, mypy, Gradle) runs here.
#
# Enable with:  pre-commit install
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^server/
      - id: ruff-format
        files: ^server/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$ # trailing spaces are a line break in Markdown
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
